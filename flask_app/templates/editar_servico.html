{% extends "base.html" %}

{% block title %}Editar Serviço - Costura Inovadora{% endblock %}

{% block content %}

    <header class="page-header">
        <div>
            <h2>Editar Serviço</h2>
            <p>Altere as informações do serviço.</p>
        </div>
    </header>


    <section class="panel">

        <form method="POST">

            <div class="form-group">

                <label for="nome_servico">
                    Nome do serviço
                </label>

                <input
                    type="text"
                    id="nome_servico"
                    name="nome_servico"
                    value="{{ servico.nome_servico }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="preco_base">
                    Preço base
                </label>

                <input
                    type="number"
                    id="preco_base"
                    name="preco_base"
                    value="{{ servico.preco_base }}"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('servicos') }}"
                class="button-link"
            >
                Cancelar
            </a>

        </form>

    </section>

{% endblock %}
