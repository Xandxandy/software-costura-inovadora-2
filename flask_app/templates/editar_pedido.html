{% extends "base.html" %}

{% block title %}Editar Pedido - Costura Inovadora{% endblock %}

{% block content %}

    <header class="page-header">
        <div>
            <h2>Editar Pedido</h2>
            <p>Altere os dados do pedido selecionado.</p>
        </div>
    </header>


    <section class="panel">

        <form method="POST">

            <div class="form-group">

                <label for="id_cliente">Cliente</label>

                <select
                    id="id_cliente"
                    name="id_cliente"
                    required
                >

                    {% for cliente in clientes %}

                        <option
                            value="{{ cliente.id_cliente }}"
                            {% if cliente.id_cliente == pedido.id_cliente %}
                                selected
                            {% endif %}
                        >
                            {{ cliente.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="valor_total">Valor total</label>

                <input
                    type="number"
                    id="valor_total"
                    name="valor_total"
                    value="{{ pedido.valor_total }}"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="data_pedido">Data do pedido</label>

                <input
                    type="date"
                    id="data_pedido"
                    name="data_pedido"
                    value="{{ pedido.data_pedido }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="status">Status</label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option
                        value="Pendente"
                        {% if pedido.status == "Pendente" %}
                            selected
                        {% endif %}
                    >
                        Pendente
                    </option>

                    <option
                        value="Em andamento"
                        {% if pedido.status == "Em andamento" %}
                            selected
                        {% endif %}
                    >
                        Em andamento
                    </option>

                    <option
                        value="Concluído"
                        {% if pedido.status == "Concluído" %}
                            selected
                        {% endif %}
                    >
                        Concluído
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="observacoes">Observações</label>

                <textarea
                    id="observacoes"
                    name="observacoes"
                    rows="4"
                >{{ pedido.observacoes or "" }}</textarea>

            </div>


            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('pedidos') }}"
                class="button-link"
            >
                Cancelar
            </a>

        </form>

    </section>

{% endblock %}
