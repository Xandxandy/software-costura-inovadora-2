{% extends "base.html" %}

{% block title %}Editar Orçamento - Costura Inovadora{% endblock %}

{% block content %}

    <header class="page-header">
        <h2>Editar Orçamento</h2>
        <p>Altere os dados antes de confirmar o orçamento.</p>
    </header>


    <section class="panel">

        <form method="POST">

            <div class="form-group">

                <label for="id_cliente">Cliente</label>

                <select
                    id="id_cliente"
                    name="id_cliente"
                    required
                >

                    {% for cliente in clientes %}

                        <option
                            value="{{ cliente.id_cliente }}"
                            {% if cliente.id_cliente == orcamento.id_cliente %}
                                selected
                            {% endif %}
                        >
                            {{ cliente.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="valor_total">Valor estimado</label>

                <input
                    type="number"
                    id="valor_total"
                    name="valor_total"
                    value="{{ orcamento.valor_total }}"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="data_pedido">Data</label>

                <input
                    type="date"
                    id="data_pedido"
                    name="data_pedido"
                    value="{{ orcamento.data_pedido }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="observacoes">Observações</label>

                <textarea
                    id="observacoes"
                    name="observacoes"
                    rows="4"
                >{{ orcamento.observacoes or "" }}</textarea>

            </div>


            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('orcamentos') }}"
                class="button-link"
            >
                Cancelar
            </a>

        </form>

    </section>

{% endblock %}
