{% extends "base.html" %}

{% block title %}Editar Cliente - Costura Inovadora{% endblock %}

{% block content %}

    <header class="page-header">
        <div>
            <h2>Editar Cliente</h2>
            <p>Atualize os dados do cliente.</p>
        </div>
    </header>


    <section class="panel">

        <form method="POST">

            <div class="form-group">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ cliente.nome }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    value="{{ cliente.telefone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ cliente.email }}"
                    required
                >

            </div>


            <!-- Endereço opcional -->
            <details class="address-details" {% if cliente.cep %}open{% endif %}>

                <summary>Adicionar endereço (opcional)</summary>

                <div class="address-fields">

                    <p>
                        Informe o CEP para registrar um endereço
                        para entrega ou retirada.
                    </p>

                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            value="{{ cliente.cep }}"
                            maxlength="9"
                        >
                    </div>

                    <div class="form-group">
                        <label for="logradouro">Logradouro</label>
                        <input
                            type="text"
                            id="logradouro"
                            name="logradouro"
                            value="{{ cliente.logradouro }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            value="{{ cliente.numero }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            value="{{ cliente.complemento }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            value="{{ cliente.bairro }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            value="{{ cliente.cidade }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="uf">UF</label>
                        <input
                            type="text"
                            id="uf"
                            name="uf"
                            value="{{ cliente.uf }}"
                            maxlength="2"
                        >
                    </div>

                </div>

            </details>


            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('inicio') }}"
                class="button-link"
            >
                Cancelar
            </a>

        </form>

    </section>

{% endblock %}
