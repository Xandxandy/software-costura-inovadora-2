{% extends "base.html" %}

{% block title %}Editar Cliente - Costura Inovadora{% endblock %}

{% block content %}

    <header class="page-header">
        <div>
            <h2>Editar Cliente</h2>
            <p>Atualize os dados do cliente.</p>
        </div>
    </header>


    <section class="panel">

        <form method="POST">

            <div class="form-group">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ cliente.nome }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    value="{{ cliente.telefone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ cliente.email }}"
                    required
                >

            </div>


            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('inicio') }}"
                class="button-link"
            >
                Cancelar
            </a>

        </form>

    </section>

{% endblock %}
