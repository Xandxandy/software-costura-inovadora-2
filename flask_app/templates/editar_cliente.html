<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Cliente - Costura Inovadora</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <h1>
                Costura<br>
                Inovadora
            </h1>

            <nav aria-label="Menu principal">
                <a href="/" class="active">Clientes</a>
                <a href="#">Pedidos</a>
                <a href="#">Serviços</a>
                <a href="#">Orçamentos</a>
            </nav>

        </aside>


        <main class="content">

            <header class="page-header">
                <div>
                    <h2>Editar Cliente</h2>
                    <p>Atualize os dados do cliente.</p>
                </div>
            </header>


            <section class="panel">

                <form method="POST">

                    <div class="form-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            value="{{ cliente.nome }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            value="{{ cliente.telefone }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ cliente.email }}"
                            required
                        >

                    </div>


                    <button type="submit">
                        Salvar alterações
                    </button>

                    <a href="/" class="button-link">
                        Cancelar
                    </a>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
