<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Costura Inovadora{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Atalho de acessibilidade para navegação por teclado -->
    <a href="#conteudo-principal" class="skip-link">
        Pular para o conteúdo principal
    </a>

    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-brand">
                <h1>Costura<br>Inovadora</h1>
                <p>Gestão do ateliê</p>
                <div class="sidebar-stitch" aria-hidden="true"></div>
            </div>

            <nav aria-label="Menu principal">

                <a
                    href="{{ url_for('inicio') }}"
                    class="{% if request.endpoint == 'inicio' %}active{% endif %}"
                    {% if request.endpoint == 'inicio' %}
                        aria-current="page"
                    {% endif %}
                >
                    Início
                </a>

                <a
                    href="{{ url_for('clientes') }}"
                    class="{% if request.endpoint in ['clientes', 'editar', 'clientes_inativos'] %}active{% endif %}"
                    {% if request.endpoint in ['clientes', 'editar', 'clientes_inativos'] %}
                        aria-current="page"
                    {% endif %}
                >
                    Clientes
                </a>

                <a
                    href="{{ url_for('pedidos') }}"
                    class="{% if request.endpoint in ['pedidos', 'editar_pedido_rota'] %}active{% endif %}"
                    {% if request.endpoint in ['pedidos', 'editar_pedido_rota'] %}
                        aria-current="page"
                    {% endif %}
                >
                    Pedidos
                </a>

                <a
                    href="{{ url_for('servicos') }}"
                    class="{% if request.endpoint in ['servicos', 'editar_servico_rota'] %}active{% endif %}"
                    {% if request.endpoint in ['servicos', 'editar_servico_rota'] %}
                        aria-current="page"
                    {% endif %}
                >
                    Serviços
                </a>

                <a
                    href="{{ url_for('orcamentos') }}"
                    class="{% if request.endpoint in ['orcamentos', 'editar_orcamento_rota'] %}active{% endif %}"
                    {% if request.endpoint in ['orcamentos', 'editar_orcamento_rota'] %}
                        aria-current="page"
                    {% endif %}
                >
                    Orçamentos
                </a>

            </nav>

        </aside>

        <div class="sewing-divider" aria-hidden="true">
            <img
                src="{{ url_for('static', filename='img/detalhe-costura.png') }}"
                alt=""
            >
        </div>

        <main
            id="conteudo-principal"
            class="content"
            tabindex="-1"
        >

            {% block content %}
            {% endblock %}

        </main>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
